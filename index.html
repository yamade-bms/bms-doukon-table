<!DOCTYPE html>
<html lang="ja">

    <head>
        <title>同梱譜面</title>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="bmstable" content="header.json" />
        <script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW" crossorigin="anonymous">
        </script>
        <style>
            /* テーブルの列幅を固定し、長い文字列は折り返す */
            #table_int {
                table-layout: fixed;
                width: 100%;
            }

            #table_int th {
                vertical-align: middle;
            }

            #table_int td {
                overflow-wrap: anywhere;
                word-break: normal;
            }

            /* ヘッダ行のベース設定 */
            .level-header td {
                position: relative;
            }

            /* 左端に配置する開閉アイコン（右向きの三角形） */
            .level-header td::before {
                content: "";
                position: absolute;
                left: 15px; /* 左端からの位置 */
                top: 50%;
                transform: translateY(-50%);
                /* CSSで三角形を描画 */
                border-style: solid;
                border-width: 6px 0 6px 10px;
                border-color: transparent transparent transparent #fff; /* 白色の矢印 */
                transition: transform 0.2s ease-in-out; /* 開閉時の回転アニメーション */
            }

            /* 展開時のアイコン（下向きに90度回転） */
            .level-header.expanded td::before {
                transform: translateY(-50%) rotate(90deg);
            }

            /* 行クラスを元に、先頭tdの左端へ内側の影(inset)を使って線を描画する */
            .row-difficulty-1 > td:first-child { box-shadow: inset 5px 0 0 0 #00ff0088; } /* beginner 緑 */
            .row-difficulty-2 > td:first-child { box-shadow: inset 5px 0 0 0 #0000ff88; } /* normal   青 */
            .row-difficulty-3 > td:first-child { box-shadow: inset 5px 0 0 0 #ffa50088; } /* hyper    オレンジ */
            .row-difficulty-4 > td:first-child { box-shadow: inset 5px 0 0 0 #ff000088; } /* another  赤 */
            .row-difficulty-5 > td:first-child { box-shadow: inset 5px 0 0 0 #cc00ff88; } /* insane   紫 */

            .text-transparent {
                color: transparent;
                user-select: none;
            }
        </style>
    </head>

    <body>
        <header class="mb-3">
            <nav class="navbar navbar-dark bg-dark">
                <div class="container-fluid">
                    <span id="header" class="navbar-brand mb-0 h1">同梱譜面</span>
                </div>
            </nav>
        </header>

        <div class="container">

            <div class="alert alert-success mb-3" role="alert">
                <p id="title">同梱譜面</p>
                <hr>
                <p>
                    ほとんど BMS SEARCH 調べです。
                </p>
                <p class="mb-0">
                    なにかあればご連絡ください。<br>
                    @yamade_bms
                </p>
            </div>


            <!--ここから難易度表本体-->
            <div style="min-height: 100vh;">
                <div id="loadContainer" class="text-center mb-4">
                    <button id="btnLoadData" class="btn btn-outline-primary btn-lg">難易度表を読み込む</button>
                </div>

                <div id="controlsContainer" class="d-flex mb-3 gap-2 d-none">
                    <input type="text" id="searchInput" class="form-control" placeholder="曲名やアーティスト名で検索...">
                    <button id="btnExpandAll" class="btn btn-outline-secondary text-nowrap">すべて展開</button>
                    <button id="btnCollapseAll" class="btn btn-outline-secondary text-nowrap">すべて閉じる</button>
                    <button id="btnReload" class="btn btn-outline-secondary text-nowrap">再読み込み</button>
                </div>

                <table class="table table-light table-striped table-hover" id="table_int">
                </table>
            </div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
